name: Build and Push to GHCR

on:
    push:
        branches:
            - master
        paths:
            - 'lib/**'
            - '!lib/**/*.test.ts'
            - Dockerfile
            - .github/workflows/build-ghcr.yml
    workflow_dispatch: {}

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/rsshub

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push chromium-bundled
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  build-args: PUPPETEER_SKIP_DOWNLOAD=0
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:chromium-bundled
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
